name: Update Monthly Fuel Prices

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fuel-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install scraper dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 lxml

      - name: Update fuel price snapshot
        run: python scripts/update_fuel_prices.py

      - name: Commit changed prices
        run: |
          if git diff --quiet -- fuel_price.json; then
            echo "fuel_price.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuel_price.json
          git commit -m "chore(prices): update monthly fuel prices for $(date -u +%Y-%m) [skip ci]"
          git push origin "${GITHUB_REF_NAME}"
